services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      FIN_SENTINELS_BACKEND_API_KEY: ${FIN_SENTINELS_BACKEND_API_KEY:?Run setup-deploy-env.ps1 first}
      FIN_SENTINELS_FRONTEND_URL: ${PUBLIC_APP_URL:-http://localhost:3000/}
      FINSENTINELS_DATA_MODE: ${FINSENTINELS_DATA_MODE:-production}
      FINSENTINELS_RUNTIME_DIR: /var/lib/finsentinels
      OBP_API_BASE_URL: ${OBP_API_BASE_URL:-https://apisandbox.openbankproject.com}
      OBP_API_VERSION: ${OBP_API_VERSION:-v5.1.0}
      OBP_ACCESS_TOKEN: ${OBP_ACCESS_TOKEN:-}
      OBP_BANK_ID: ${OBP_BANK_ID:-}
      OBP_VIEW_ID: ${OBP_VIEW_ID:-}
      OBP_ACCOUNT_IDS: ${OBP_ACCOUNT_IDS:-}
      OBP_WEBHOOK_SECRET: ${OBP_WEBHOOK_SECRET:-}
      OBP_WEBHOOK_SIGNATURE_HEADER: ${OBP_WEBHOOK_SIGNATURE_HEADER:-x-sandbox-signature}
      OBP_DEFAULT_CURRENCY: ${OBP_DEFAULT_CURRENCY:-}
      FIN_SENTINELS_BASE_CURRENCY: ${FIN_SENTINELS_BASE_CURRENCY:-INR}
      OBP_SYNC_PAGE_SIZE: ${OBP_SYNC_PAGE_SIZE:-100}
      OBP_SYNC_MAX_PAGES: ${OBP_SYNC_MAX_PAGES:-10}
    expose:
      - "8000"
    volumes:
      - runtime-data:/var/lib/finsentinels
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/api/health',headers={'x-fin-sentinels-backend-key':os.environ['FIN_SENTINELS_BACKEND_API_KEY']}); urllib.request.urlopen(req,timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      FIN_SENTINELS_USERNAME: ${FIN_SENTINELS_USERNAME:?Run setup-deploy-env.ps1 first}
      FIN_SENTINELS_PASSWORD: ${FIN_SENTINELS_PASSWORD:?Run setup-deploy-env.ps1 first}
      FIN_SENTINELS_SESSION_SECRET: ${FIN_SENTINELS_SESSION_SECRET:?Run setup-deploy-env.ps1 first}
      FIN_SENTINELS_BACKEND_API_KEY: ${FIN_SENTINELS_BACKEND_API_KEY:?Run setup-deploy-env.ps1 first}
      FIN_SENTINELS_COOKIE_SECURE: ${FIN_SENTINELS_COOKIE_SECURE:-false}
      FIN_API_INTERNAL_URL: http://api:8000
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/auth/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  runtime-data:
